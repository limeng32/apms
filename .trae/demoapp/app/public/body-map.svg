      <path d="M326 104 q18 8 24 30 l12 66 q3 12 -6 20 l-10 6 -12 -10 8 -8 -12 -56 q-4 -18 -12 -26 Z"/>
      <path d="M264 262 h30 l-4 130 q0 10 -6 16 l-2 96 q0 10 -10 10 h-14 q-10 0 -10 -10 l2 -96 q-6 -6 -6 -16 Z"/>
      <path d="M296 262 h30 l10 130 q0 10 -6 16 l2 96 q0 10 -10 10 h-14 q-10 0 -10 -10 l-2 -96 q-6 -6 -6 -16 Z"/>

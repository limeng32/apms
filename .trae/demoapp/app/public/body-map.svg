      <circle cx="89" cy="392" r="3" fill="#475569" stroke="none" opacity="0.4"/>
      <circle cx="121" cy="392" r="3" fill="#475569" stroke="none" opacity="0.4"/>
    </g>
    <!-- ===== back view (right) ===== -->

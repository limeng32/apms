    <!-- right penalty area -->
    <rect x="610" y="220" width="150" height="360"/>
    <rect x="700" y="310" width="60" height="180"/>
    <path d="M 610 340 A 110 110 0 0 0 610 460"/>
    <circle cx="660" cy="400" r="3" fill="#06B6D4" fill-opacity="0.08"/>
    <!-- corner arcs -->
    <path d="M 40 52 A 12 12 0 0 0 52 40"/>
    <path d="M 748 40 A 12 12 0 0 0 760 52"/>
    <path d="M 760 748 A 12 12 0 0 0 748 760"/>
    <path d="M 52 760 A 12 12 0 0 0 40 748"/>

    <rect x="40" y="40" width="720" height="720"/>
    <!-- halfway line -->
    <line x1="400" y1="40" x2="400" y2="760"/>
    <!-- center circle -->
    <circle cx="400" cy="400" r="100"/>
    <circle cx="400" cy="400" r="4" fill="#06B6D4" fill-opacity="0.08"/>
    <!-- left penalty area -->
    <rect x="40" y="220" width="150" height="360"/>

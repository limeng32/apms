<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>队员档案 · 运动员管理系统</title>
<link rel="stylesheet" href="assets/app.css?v=20260915a">
</head>
<body>
<div id="app"></div>
<script src="assets/mock.js?v=20260915a"></script>
<script src="assets/app.js?v=20260915a"></script>
<script>
renderShell('profile', '队员档案');

document.getElementById('content').innerHTML = `
  <div class="page-head">
    <div>
      <div class="page-title">队员中心</div>
    </div>
  </div>

  <div class="layout-split">
    ${rosterHTML(HERO.id)}

    <div class="pane">
      <div style="margin-bottom:14px">
        <div class="page-title" style="font-size:20px">队员数字档案</div>
        <div class="page-sub">集中查看基础资料、生长发育、测试表现与医疗康复记录</div>
      </div>

      <!-- 档案头卡 -->
      <div class="profile-hero">
        <div class="avatar avatar-xl ph-avatar" style="background:${HERO.color}">${HERO.name.charAt(0)}</div>
        <div>
          <div class="ph-name">${HERO.name} ${rtpBadge(HERO.rtp)}</div>
          <div class="ph-sub">中前卫 · U18梯队 · 左脚</div>
          <div class="ph-tags">
            <span class="ph-tag">U18梯队</span>
            <span class="ph-tag">RTP限制型</span>
          </div>
        </div>
        <div class="big-num">8</div>
        <div class="ph-actions">
          <a class="btn btn-ghost btn-sm" href="phv.html">生长发育</a>
          <a class="btn btn-ghost btn-sm" href="report.html">生成报告</a>
        </div>
      </div>

      <!-- Tab -->
      <div class="card" style="margin-top:16px">
        <div class="tabs">
          <a class="tab active" href="profile.html">档案概况</a>
          <a class="tab" href="report.html">测试趋势</a>
          <a class="tab" href="health.html">健康状态</a>
        </div>

        <div class="card-b" style="padding-top:16px">
          <div class="grid grid-2" style="gap:14px">
            <!-- 基础体态 -->
            <div class="card" style="box-shadow:none">
              <div class="card-h">
                <div class="card-title">基础体态 <small>最近测量：${BODY.date}</small></div>
              </div>
              <div class="card-b">
                <div class="grid grid-2" style="gap:10px">
                  <div class="metric"><div class="m-label">站立身高</div><div class="m-value">${BODY.height}<span class="u">cm</span></div></div>
                  <div class="metric"><div class="m-label">体重</div><div class="m-value">${BODY.weight}<span class="u">kg</span></div></div>
                  <div class="metric"><div class="m-label">坐高</div><div class="m-value">${BODY.sitHeight}<span class="u">cm</span></div></div>
                  <div class="metric"><div class="m-label">出生日期</div><div class="m-value" style="font-size:18px;padding-top:4px">${BODY.birthday}</div></div>
                </div>
              </div>
            </div>

            <!-- 最新专项表现 -->
            <div class="card" style="box-shadow:none">
              <div class="card-h">
                <div class="card-title">最新专项表现 <small>U18暑期启动综合测试</small></div>
              </div>
              <div class="card-b">
                <div class="grid grid-2" style="gap:10px">
                  ${LATEST_TESTS.map(m => `
                    <div class="metric">
                      <div class="m-label">${m.label}</div>
                      <div class="m-value">${m.value}<span class="u">${m.unit}</span></div>
                    </div>`).join('')}
                </div>
              </div>
            </div>
          </div>

          <!-- 参训限制 -->
          <div style="margin-top:14px">
            <div class="card-title" style="margin-bottom:9px">参训限制 <span style="font-weight:400;font-size:12px;color:var(--text-3);margin-left:8px">下次复核：${RTP_LIMIT.reviewDate}</span></div>
            <div class="notice notice-amber">
              ${ICONS.warn}
              <div><b>限制参训</b> · ${RTP_LIMIT.content}</div>
              <a class="link" href="health.html">查看状态历程 →</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
`;
</script>
</body>
</html>

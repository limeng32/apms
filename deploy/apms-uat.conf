# =====================================================================
# APMS UAT — 本机模拟生产（与本机活配置 /opt/homebrew/etc/nginx/servers/apms-uat.conf 同源）
# 入口: http://localhost/
# 后端: localhost:9080 (Actuator 9081 不对公网暴露)
# 正式前端: .uat/frontend/dist（deploy-uat.sh Step 4 同步）
# 演示站:   .uat/frontend/trial-dist（deploy-uat.sh 自动构建同步，入口 /trial/）
# 历史：早期版本监听 8088、root 指向 /opt/apms-uat，现网已改为 80 + 仓库内 .uat 目录。
# =====================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  localhost;

    # ── 正式前端静态文件 ──
    root /Users/limeng/Documents/trae_projects/apms/.uat/frontend/dist;
    index  index.html index.htm;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── 前端路由 history 模式兜底 ──
    # 不用 $uri/：静态目录与路由同名（如 /login/）时会命中目录且无 index.html → 403
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 同域演示站 /trial/（独立产物 frontend/trial-dist，deploy-uat.sh 自动分发，
    # 与正式 dist 物理隔离；演示态零真实请求，无需反代 /prod-api）。
    # 三个块均用 ^~/= 前缀匹配，优先级高于静态资源正则 location；
    # 各块显式 alias，避免嵌套 location 继承 alias 时的路径拼接歧义。
    location ^~ /trial/static/ {
        alias /Users/limeng/Documents/trae_projects/apms/.uat/frontend/trial-dist/static/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location = /trial/index.html {
        alias /Users/limeng/Documents/trae_projects/apms/.uat/frontend/trial-dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ^~ /trial/ {
        alias /Users/limeng/Documents/trae_projects/apms/.uat/frontend/trial-dist/;
        index index.html;
        # Vue History 模式：真实文件命中 $uri，演示路由（/trial/login、/trial/apms/**）统一回退 index.html
        try_files $uri $uri/ /trial/index.html;
    }

    # ── 后端 API 反代（去掉 /prod-api 前缀） ──
    location /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # strip /prod-api → 后端收到 /apms/xxx
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_pass http://localhost:9080;
    }

    # Actuator 健康检查不对外暴露（只本机直连 9081）
}

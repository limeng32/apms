# =====================================================================
# HTTP (80)
# =====================================================================

# aoti 正式业务域名：全站 301 跳转 HTTPS
# （DV 证书覆盖 aoti.apms.top 与 www.aoti.apms.top）
server {
    listen       80;
    listen       [::]:80;
    server_name  aoti.apms.top www.aoti.apms.top;

    return 301 https://aoti.apms.top$request_uri;
}

# 品牌域名：全站 301 跳转各自的 HTTPS（保留访问域名，裸域与 www 同页）
# （DV 证书覆盖 www.apms.top 与 apms.top）
server {
    listen       80;
    listen       [::]:80;
    server_name  www.apms.top apms.top;

    return 301 https://$host$request_uri;
}

# 兜底：任何其他 Host（含 IP 直连）仍走 HTTP 完整登录站，行为与最初一致。
# 必须显式 default_server：多个 80 server 时 nginx 默认把第一个（aoti 跳转块）当默认，
# 会导致 IP 直连被 301 到 aoti 域名。
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root   /opt/apms/frontend/dist;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/xml+rss application/vnd.ms-fontobject application/x-font-ttf font/opentype;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # RuoYi 路由兜底 — Vue History 模式
    # 不要用 $uri/：若 public 静态目录与前端路由同名（如 /login/），命中真实目录但无
    # index.html 且 autoindex off 时会直接 403，SPA 回退失效。真实文件由 $uri 命中，
    # 根 / 仍由 index 模块处理，其余一律回退 index.html。
    location / {
        try_files $uri /index.html;
    }

    # 后端 API 反代 — 去掉 /prod-api 前缀后转发到 8080
    location ^~ /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/prod-api/(.*)$ /$1 break;
        # 用 127.0.0.1 而非 localhost：后者同时解析出 v4/v6 两个 peer，重启窗口
        # 被拒绝时两个 peer 都会被 nginx 熔断标记，直接 "no live upstreams" 502。
        proxy_pass http://127.0.0.1:10080;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # 上传文件大小限制
    client_max_body_size 50m;

    # 静态资源缓存（构建产物全部带内容哈希，可安全长缓存：
    # 运营替换登录背景/Logo 后哈希变化即新文件名，浏览器自动拉新）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
    }
}

# =====================================================================
# HTTPS (443) — aoti.apms.top 正式业务站
# 证书 SAN: aoti.apms.top, www.aoti.apms.top
# =====================================================================
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2 on;
    server_name  aoti.apms.top www.aoti.apms.top;

    ssl_certificate     /etc/nginx/ssl/aoti.apms.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aoti.apms.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root   /opt/apms/frontend/dist;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/xml+rss application/vnd.ms-fontobject application/x-font-ttf font/opentype;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # RuoYi 路由兜底 — Vue History 模式
    location / {
        try_files $uri /index.html;
    }

    # 后端 API 反代 — 去掉 /prod-api 前缀后转发到 8080
    location ^~ /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:10080;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # 上传文件大小限制
    client_max_body_size 50m;

    # 静态资源缓存（构建产物全部带内容哈希，可安全长缓存：
    # 运营替换登录背景/Logo 后哈希变化即新文件名，浏览器自动拉新）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
    }
}

# =====================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /opt/apms/frontend/dist;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/xml+rss application/vnd.ms-fontobject application/x-font-ttf font/opentype;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # RuoYi 路由兜底 — Vue History 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代 — 去掉 /prod-api 前缀后转发到 8080
    location ^~ /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_pass http://localhost:8080;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # 上传文件大小限制
    client_max_body_size 50m;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
    }
}

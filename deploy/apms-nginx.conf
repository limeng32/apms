server {
    listen       80;
    listen       [::]:80;
    # 同一份 dist 服务两个入口（形态由前端按 hostname 判定）：
    #   aoti.apms.top            → 完整登录/业务系统
    #   www.apms.top / apms.top  → 纯品牌展示落地页（裸域与 www 同页，无登录入口）
    # 保留 _ 兜底：任何其他 Host（含 IP 直连）仍是完整登录站，行为与以往一致。
    server_name  aoti.apms.top www.apms.top apms.top _;

    root   /opt/apms/frontend/dist;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/xml+rss application/vnd.ms-fontobject application/x-font-ttf font/opentype;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # RuoYi 路由兜底 — Vue History 模式
    # 不要用 $uri/：若 public 静态目录与前端路由同名（如 /login/），命中真实目录但无
    # index.html 且 autoindex off 时会直接 403，SPA 回退失效。真实文件由 $uri 命中，
    # 根 / 仍由 index 模块处理，其余一律回退 index.html。
    location / {
        try_files $uri /index.html;
    }

    # 后端 API 反代 — 去掉 /prod-api 前缀后转发到 8080
    location ^~ /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_pass http://localhost:10080;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # 上传文件大小限制
    client_max_body_size 50m;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
    }
}
